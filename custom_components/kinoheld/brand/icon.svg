<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Film strip outer border -->
  <rect x="2" y="4" width="20" height="16" rx="2"/>
  <!-- Sprocket holes left -->
  <rect x="2" y="6.5" width="3" height="2.5" rx="0.5" fill="currentColor" stroke="none"/>
  <rect x="2" y="10.75" width="3" height="2.5" rx="0.5" fill="currentColor" stroke="none"/>
  <rect x="2" y="15" width="3" height="2.5" rx="0.5" fill="currentColor" stroke="none"/>
  <!-- Sprocket holes right -->
  <rect x="19" y="6.5" width="3" height="2.5" rx="0.5" fill="currentColor" stroke="none"/>
  <rect x="19" y="10.75" width="3" height="2.5" rx="0.5" fill="currentColor" stroke="none"/>
  <rect x="19" y="15" width="3" height="2.5" rx="0.5" fill="currentColor" stroke="none"/>
  <!-- Horizontal dividers -->
  <line x1="5" y1="9.5" x2="19" y2="9.5"/>
  <line x1="5" y1="14.5" x2="19" y2="14.5"/>
  <!-- Play triangle in middle frame -->
  <polygon points="10,10.5 10,14 14,12.25" fill="currentColor" stroke="none"/>
</svg>
